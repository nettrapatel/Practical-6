<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Movie Explorer</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background: #0f172a;

            color: white;
        }


        header {

            text-align: center;

            padding: 35px;

            background: #020617;
        }


        header h1 {

            font-size: 35px;

            margin-bottom: 10px;
        }


        main {

            width: 90%;

            max-width: 1100px;

            margin: 30px auto;
        }


        .search-box {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }


        .search-box input {

            flex: 1;

            padding: 14px;

            border-radius: 8px;

            border: none;

            font-size: 16px;
        }


        .search-box button {

            padding: 14px 25px;

            border: none;

            border-radius: 8px;

            background: #e11d48;

            color: white;

            cursor: pointer;

            font-size: 16px;
        }


        .search-box button:hover {

            background: #be123c;
        }


        .genre-box {

            background: #1e293b;

            padding: 20px;

            border-radius: 10px;

            margin-bottom: 20px;
        }


        .genre-box select {

            padding: 10px;

            border-radius: 6px;

            border: none;

            margin-left: 10px;
        }


        #status {

            text-align: center;

            margin: 20px;
        }


        .movie-container {

            display: grid;

            grid-template-columns:
                repeat(auto-fit,
                minmax(220px, 1fr));

            gap: 25px;
        }


        .movie-card {

            background: #1e293b;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 5px 15px
                rgba(0,0,0,0.4);

            transition: 0.3s;
        }


        .movie-card:hover {

            transform:
                translateY(-5px);
        }


        .movie-card img {

            width: 100%;

            height: 320px;

            object-fit: cover;
        }


        .movie-info {

            padding: 18px;
        }


        .movie-info h2 {

            font-size: 20px;

            margin-bottom: 10px;
        }


        .movie-info p {

            margin: 7px 0;

            color: #cbd5e1;
        }


        footer {

            text-align: center;

            background: #020617;

            padding: 20px;

            margin-top: 40px;
        }


        @media(max-width:600px) {

            .search-box {

                flex-direction: column;
            }


            .search-box button {

                width: 100%;
            }

        }

    </style>

</head>


<body>


    <header>

        <h1>
            🎬 Movie Explorer
        </h1>

        <p>
            Search and explore your favourite movies
        </p>

    </header>


    <main>


        <div class="search-box">

            <input
                type="text"
                id="movieInput"
                placeholder="Enter movie name"
            >


            <button onclick="searchMovies()">

                Search

            </button>

        </div>


        <div class="genre-box">

            <label>
                Select Preferred Genre:
            </label>


            <select
                id="genre"
                onchange="saveGenre()">

                <option value="">
                    Select Genre
                </option>

                <option value="Action">
                    Action
                </option>

                <option value="Comedy">
                    Comedy
                </option>

                <option value="Drama">
                    Drama
                </option>

                <option value="Horror">
                    Horror
                </option>

                <option value="Romance">
                    Romance
                </option>

                <option value="Sci-Fi">
                    Sci-Fi
                </option>

                <option value="Thriller">
                    Thriller
                </option>

            </select>

        </div>


        <p id="status"></p>


        <div
            id="movieContainer"
            class="movie-container">
        </div>


    </main>


    <footer>

        <p>
            Movie Explorer using Public API
        </p>

    </footer>


    <script>


        // Enter your OMDb API key here
        const API_KEY = "YOUR_API_KEY";


        // Load saved genre
        window.onload = function() {

            let savedGenre =
                localStorage.getItem(
                    "preferredGenre"
                );


            if (savedGenre) {

                document.getElementById(
                    "genre"
                ).value =
                    savedGenre;

            }

        };


        // Save preferred genre
        function saveGenre() {

            let genre =
                document.getElementById(
                    "genre"
                ).value;


            if (genre !== "") {

                localStorage.setItem(
                    "preferredGenre",
                    genre
                );


                document.getElementById(
                    "status"
                ).innerText =
                    "Preferred genre saved: "
                    + genre;

            }

        }


        // Search movies
        async function searchMovies() {

            let movieName =
                document.getElementById(
                    "movieInput"
                ).value.trim();


            let status =
                document.getElementById(
                    "status"
                );


            let container =
                document.getElementById(
                    "movieContainer"
                );


            if (movieName === "") {

                status.innerText =
                    "Please enter a movie name.";

                return;

            }


            if (API_KEY === "YOUR_API_KEY") {

                status.innerText =
                    "Please enter your OMDb API key.";

                return;

            }


            status.innerText =
                "Searching movies...";


            try {

                let url =
                    "https://www.omdbapi.com/"
                    + "?apikey=" + API_KEY
                    + "&s="
                    + encodeURIComponent(
                        movieName
                    );


                let response =
                    await fetch(url);


                let data =
                    await response.json();


                if (data.Response === "False") {

                    status.innerText =
                        "Movie not found.";

                    container.innerHTML =
                        "";

                    return;

                }


                container.innerHTML =
                    "";


                data.Search.forEach(
                    function(movie) {


                        let card =
                            document.createElement(
                                "article"
                            );


                        card.className =
                            "movie-card";


                        let poster =
                            movie.Poster;


                        if (poster === "N/A") {

                            poster =
                                "https://via.placeholder.com/300x450?text=No+Poster";

                        }


                        card.innerHTML = `

                            <img
                                src="${poster}"
                                alt="${movie.Title}"
                            >

                            <div class="movie-info">

                                <h2>
                                    ${movie.Title}
                                </h2>

                                <p>
                                    <strong>Year:</strong>
                                    ${movie.Year}
                                </p>

                                <p>
                                    <strong>Type:</strong>
                                    ${movie.Type}
                                </p>

                            </div>

                        `;


                        container.appendChild(
                            card
                        );

                    });


                status.innerText =
                    data.Search.length
                    + " movie(s) found.";

            }


            catch(error) {

                console.log(error);

                status.innerText =
                    "Error while fetching movie data.";

            }

        }

    </script>


</body>

</html>
